<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<meta name="theme-color" content="#0A1A3A">
<script>try{var t=new URLSearchParams(location.search).get("theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your appointment | Optimus Garage Company</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&amp;family=Barlow:wght@500;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="track open" id="track" role="dialog" aria-modal="true" aria-labelledby="tk-title" aria-hidden="false">
  <div class="tk-head">
    <div class="logo"><span>Optimus<small>Garage Company</small></span></div>
    <a class="tk-x" href="/" aria-label="Back to site" style="text-decoration:none;display:grid;place-items:center">×</a>
  </div>
  <div class="wrap tk-body">
    <h1 id="tk-title">Request received</h1>
    <p class="tk-big" id="tk-big"></p>
    <p class="tk-sub" id="tk-sub"></p>
    <div class="tk-seg" id="tk-seg" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="tk-names" id="tk-names"><span>Received</span><span>Confirmed</span><span>On the way</span><span>Done</span></div>
    <div class="tk-card"><strong id="tk-addr">Your address</strong><small id="tk-svc"></small></div>
    <a class="slam" id="tk-call" href="tel:+15555550123">Call us</a>
    <a class="slam blue tk-review" id="tk-review" target="_blank" rel="noopener">Leave us a review</a>
    <div class="tk-act" id="tk-act">
      <h3>Need a different time?</h3>
      <input type="date" id="rs-date" aria-label="New day">
      <select id="rs-slot" aria-label="New arrival window"><option value="">Pick a day first</option></select>
      <button class="slam" id="rs-go">Change my time</button>
      <p class="msg" id="rs-msg" role="status"></p>
      <button class="ghost danger" id="cx-go">Cancel this visit</button>
    </div>
    <p class="fine" id="tk-via"></p>
      </div>
</div>

<script src="/track.js"></script>
</body>
</html>
